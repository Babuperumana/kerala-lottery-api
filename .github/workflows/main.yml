name: Auto Scraper

on:
  schedule:
    # 09:15 UTC is 14:45 IST (2:45 PM). We start 15 mins early to avoid GitHub's queue delays.
    - cron: '15 9 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run Scraper
        env:
          LOTTERY_URL: ${{ vars.LOTTERY_URL }}
        run: python scraper.py
